<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, dpr;
let particles = [];
let stars = [];
let water = [];

const PARTICLE_COUNT = 3500;
const STAR_COUNT = 180;
const WATER_COUNT = 700;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
    createStars();
    createWater();
}

/* =========================
   TRÁI TIM
========================= */

function heartX(t) {
    return 16 * Math.pow(Math.sin(t), 3);
}

function heartY(t) {
    return 13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);
}

/* =========================
   HẠT TRÁI TIM
========================= */

function createHeart() {
    particles = [];

    const scale =
        Math.min(W, H) *
        (W < 600 ? 0.025 : 0.032);

    const cx = W / 2;
    const cy = H * 0.39;

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random());

        const x =
            heartX(t) * r +
            (Math.random() - 0.5) * 1.2;

        const y =
            heartY(t) * r +
            (Math.random() - 0.5) * 1.2;

        particles.push({
            baseX: cx + x * scale,
            baseY: cy - y * scale,

            size:
                Math.random() < 0.08
                ? Math.random() * 1.8 + 1
                : Math.random() * 1.1 + 0.3,

            alpha:
                Math.random() * 0.75 + 0.25,

            phase:
                Math.random() * Math.PI * 2,

            speed:
                Math.random() * 0.002 + 0.001
        });
    }
}

/* =========================
   SAO
========================= */

function createStars() {
    stars = [];

    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 1.2 + 0.2,
            alpha: Math.random() * 0.6 + 0.1,
            phase: Math.random() * Math.PI * 2
        });
    }
}

/* =========================
   MẶT NƯỚC
========================= */

function createWater() {
    water = [];

    const waterY = H * 0.64;

    for (let i = 0; i < WATER_COUNT; i++) {
        const x =
            W / 2 +
            (Math.random() - 0.5) * W * 0.8;

        const y =
            waterY +
            Math.random() * H * 0.22;

        water.push({
            x,
            y,
            size: Math.random() * 1.4 + 0.2,
            alpha: Math.random() * 0.5 + 0.1,
            phase: Math.random() * Math.PI * 2
        });
    }
}

/* =========================
   SAO
========================= */

function drawStars(time) {

    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff";

    for (const star of stars) {

        const blink =
            0.4 +
            Math.sin(
                time * 0.002 + star.phase
            ) * 0.3;

        ctx.globalAlpha =
            Math.max(0, star.alpha * blink);

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* =========================
   TIM ĐẬP
========================= */

function heartbeat(time) {

    const t = (time % 1000) / 1000;

    if (t < 0.12) {
        return 1 +
            Math.sin(
                t / 0.12 * Math.PI
            ) * 0.05;
    }

    if (t > 0.18 && t < 0.28) {
        return 1 +
            Math.sin(
                (t - 0.18) / 0.1 * Math.PI
            ) * 0.025;
    }

    return 1;
}

/* =========================
   TRÁI TIM
========================= */

function drawHeart(time) {

    const cx = W / 2;
    const cy = H * 0.39;
    const beat = heartbeat(time);

    for (const p of particles) {

        const floatingX =
            Math.cos(
                time * p.speed + p.phase
            ) * 0.7;

        const floatingY =
            Math.sin(
                time * p.speed + p.phase
            ) * 1.2;

        const x =
            cx +
            (p.baseX - cx) * beat +
            floatingX;

        const y =
            cy +
            (p.baseY - cy) * beat +
            floatingY;

        const sparkle =
            0.55 +
            Math.sin(
                time * 0.004 + p.phase
            ) * 0.45;

        ctx.globalAlpha =
            p.alpha * sparkle;

        ctx.fillStyle =
            p.size > 1.4
            ? "#ff96cd"
            : "#ff469b";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* =========================
   PHẢN CHIẾU
========================= */

function drawReflection(time) {

    const waterY = H * 0.64;

    for (
        let i = 0;
        i < particles.length;
        i += 2
    ) {

        const p = particles[i];

        const distance =
            waterY - p.baseY;

        if (distance <= 0 ||
            distance > H * 0.25) {
            continue;
        }

        const depth =
            distance / (H * 0.25);

        const y =
            waterY + distance;

        const wave =
            Math.sin(
                y * 0.04 +
                time * 0.003
            ) *
            (2 + depth * 10);

        const x =
            p.baseX + wave;

        ctx.globalAlpha =
            p.alpha *
            (1 - depth) *
            0.3;

        ctx.fillStyle = "#ff64af";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size * (1 - depth * 0.5),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* =========================
   NƯỚC
========================= */

function drawWater(time) {

    for (const p of water) {

        const x =
            p.x +
            Math.sin(
                p.x * 0.02 +
                time * 0.002 +
                p.phase
            ) * 4;

        const y =
            p.y +
            Math.sin(
                time * 0.002 +
                p.phase
            ) * 2;

        const sparkle =
            0.5 +
            Math.sin(
                time * 0.003 +
                p.phase
            ) * 0.5;

        ctx.globalAlpha =
            Math.max(
                0,
                p.alpha * sparkle
            );

        ctx.fillStyle = "#64e6ff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* =========================
   CHỮ
========================= */

function drawText(time) {

    const cx = W / 2;
    const cy = H * 0.69;

    const radiusX =
        Math.min(W, H) * 0.18;

    const radiusY =
        Math.min(W, H) * 0.045;

    const text = "Anh yêu em • ";

    const fontSize =
        Math.max(
            9,
            Math.min(15, W * 0.018)
        );

    ctx.save();

    ctx.font =
        `bold ${fontSize}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#fff";
    ctx.globalAlpha = 0.9;

    const repeated = text.repeat(5);

    const offset =
        time * 0.00025;

    for (
        let i = 0;
        i < repeated.length;
        i++
    ) {

        const angle =
            i / repeated.length *
            Math.PI * 2 +
            offset;

        const x =
            cx +
            Math.cos(angle) *
            radiusX;

        const y =
            cy +
            Math.sin(angle) *
            radiusY;

        ctx.save();

        ctx.translate(x, y);

        ctx.rotate(
            angle + Math.PI / 2
        );

        ctx.fillText(
            repeated[i],
            0,
            0
        );

        ctx.restore();
    }

    ctx.restore();

    ctx.globalAlpha = 1;
}

/* =========================
   ANIMATION
========================= */

function animate(time) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    drawStars(time);
    drawReflection(time);
    drawWater(time);
    drawText(time);
    drawHeart(time);

    requestAnimationFrame(animate);
}

/* =========================
   START
========================= */

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(animate);
</script>

</body>
</html>
