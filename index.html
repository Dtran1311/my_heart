<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Heart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;
let particles = [];
let stars = [];
let water = [];

const PARTICLE_COUNT = 2500;
const STAR_COUNT = 150;
const WATER_COUNT = 400;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createHeart();
    createStars();
    createWater();
}

window.addEventListener("resize", resize);

function heartX(t) {
    return 16 * Math.pow(Math.sin(t), 3);
}

function heartY(t) {
    return 13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);
}

function createHeart() {
    particles = [];

    const scale = Math.min(W, H) * 0.032;
    const centerX = W / 2;
    const centerY = H * 0.37;

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        const t = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random());

        const x = heartX(t) * r;
        const y = heartY(t) * r;

        particles.push({
            baseX: centerX + x * scale,
            baseY: centerY - y * scale,
            size: Math.random() * 1.4 + 0.3,
            alpha: Math.random() * 0.8 + 0.2,
            phase: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.002 + 0.001
        });
    }
}

function createStars() {
    stars = [];

    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H * 0.65,
            size: Math.random() * 1.3 + 0.2,
            alpha: Math.random() * 0.7 + 0.1,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function createWater() {
    water = [];

    const waterY = H * 0.62;

    for (let i = 0; i < WATER_COUNT; i++) {
        const x = Math.random() * W;
        const y = waterY + Math.random() * H * 0.25;

        water.push({
            x,
            y,
            phase: Math.random() * Math.PI * 2,
            size: Math.random() * 1.3 + 0.2,
            alpha: Math.random() * 0.5 + 0.1
        });
    }
}

function drawStars(time) {
    for (const star of stars) {

        const alpha =
            star.alpha *
            (0.5 + Math.sin(time * 0.002 + star.phase) * 0.5);

        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0, alpha)})`;

        ctx.arc(
            star.x,
            star.y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

function heartbeat(time) {

    const t = (time % 1000) / 1000;

    if (t < 0.12) {
        return 1 + Math.sin(t / 0.12 * Math.PI) * 0.05;
    }

    if (t > 0.18 && t < 0.28) {
        return 1 +
            Math.sin((t - 0.18) / 0.1 * Math.PI) * 0.025;
    }

    return 1;
}

function drawHeart(time) {

    const cx = W / 2;
    const cy = H * 0.37;
    const beat = heartbeat(time);

    for (const p of particles) {

        const floatingX =
            Math.cos(time * p.speed + p.phase) * 0.7;

        const floatingY =
            Math.sin(time * p.speed + p.phase) * 1.2;

        const x =
            cx + (p.baseX - cx) * beat + floatingX;

        const y =
            cy + (p.baseY - cy) * beat + floatingY;

        const sparkle =
            0.5 +
            Math.sin(time * 0.004 + p.phase) * 0.5;

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,70,155,${p.alpha * sparkle})`;

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

function drawReflection(time) {

    const waterY = H * 0.62;

    for (let i = 0; i < particles.length; i += 3) {

        const p = particles[i];

        const distance = waterY - p.baseY;

        if (distance <= 0 || distance > H * 0.22)
            continue;

        const depth = distance / (H * 0.22);

        const y = waterY + distance;

        const wave =
            Math.sin(y * 0.04 + time * 0.003) *
            (2 + depth * 10);

        const x = p.baseX + wave;

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(255,80,160,${p.alpha * (1-depth) * 0.25})`;

        ctx.arc(
            x,
            y,
            p.size * (1 - depth * 0.5),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

function drawWater(time) {

    for (const p of water) {

        const x =
            p.x +
            Math.sin(p.x * 0.02 + time * 0.002 + p.phase) * 4;

        const y =
            p.y +
            Math.sin(time * 0.002 + p.phase) * 2;

        const sparkle =
            0.5 +
            Math.sin(time * 0.003 + p.phase) * 0.5;

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(100,230,255,${Math.max(
                0,
                p.alpha * sparkle
            )})`;

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

function drawText(time) {

    const centerX = W / 2;
    const centerY = H * 0.68;

    const radiusX = Math.min(W, H) * 0.18;
    const radiusY = Math.min(W, H) * 0.045;

    const text = "Anh yêu em • ";

    const fontSize =
        Math.max(10, Math.min(15, W * 0.018));

    ctx.save();

    ctx.font = `bold ${fontSize}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,0.9)";

    const repeated = text.repeat(5);
    const offset = time * 0.00025;

    for (let i = 0; i < repeated.length; i++) {

        const angle =
            i / repeated.length * Math.PI * 2 + offset;

        const x =
            centerX + Math.cos(angle) * radiusX;

        const y =
            centerY + Math.sin(angle) * radiusY;

        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(angle + Math.PI / 2);

        ctx.fillText(repeated[i], 0, 0);

        ctx.restore();
    }

    ctx.restore();
}

function animate(time) {

    ctx.clearRect(0, 0, W, H);

    drawStars(time);
    drawReflection(time);
    drawWater(time);
    drawText(time);
    drawHeart(time);

    requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
